name: winget install test
on: workflow_dispatch
permissions: {}
jobs:
  winget:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Ensure winget
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force | Out-Null
            Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery
            Repair-WinGetPackageManager -AllUsers -Latest
          }
          winget --version
      - name: Search and show
        run: |
          winget source update
          winget search CodeForFire.Lagebuch --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { exit 1 }
          winget show --id CodeForFire.Lagebuch -e --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install
        run: |
          winget install --id CodeForFire.Lagebuch -e --silent --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { Write-Error "install exit $LASTEXITCODE"; exit 1 }
      - name: Verify install
        run: |
          Get-ChildItem "$env:ProgramFiles\Lagebuch" | Select-Object -First 30 Name
          $exe = Get-ChildItem "$env:ProgramFiles\Lagebuch" -Filter *.exe -Recurse | Select-Object -First 5
          $exe | ForEach-Object { $_.FullName; $_.VersionInfo.ProductVersion }
          if (-not $exe) { Write-Error "no exe"; exit 1 }
          winget list --id CodeForFire.Lagebuch -e
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Uninstall
        run: |
          winget uninstall --id CodeForFire.Lagebuch -e --silent
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path "$env:ProgramFiles\Lagebuch\*.exe") { Write-Error "still installed"; exit 1 }
          "uninstalled"
