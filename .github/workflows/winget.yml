name: winget install test
on: workflow_dispatch
permissions: {}
jobs:
  winget:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Ensure winget
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force | Out-Null
            Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery
            Repair-WinGetPackageManager -AllUsers -Latest
          }
          winget --version
      - name: Search and show
        run: |
          winget source update
          winget search CodeForFire.Lagebuch --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { exit 1 }
          winget show --id CodeForFire.Lagebuch -e --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install
        run: |
          winget install --id CodeForFire.Lagebuch -e --silent --accept-package-agreements --accept-source-agreements --log "$env:RUNNER_TEMP\winget-install.log"
          if ($LASTEXITCODE -ne 0) { Write-Error "install exit $LASTEXITCODE"; exit 1 }
      - name: Verify install
        run: |
          "--- winget list"
          winget list --id CodeForFire.Lagebuch -e
          $listExit = $LASTEXITCODE
          "--- uninstall registry entries"
          $keys = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                  'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*',
                  'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*'
          Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object DisplayName -like '*Lagebuch*' |
            Format-List DisplayName, DisplayVersion, InstallLocation, PSPath
          "--- search for LageBuch.App.exe"
          $roots = "$env:ProgramFiles", "${env:ProgramFiles(x86)}", "$env:LOCALAPPDATA\Programs"
          $exe = Get-ChildItem $roots -Filter LageBuch.App.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 5
          $exe | ForEach-Object { $_.FullName; $_.VersionInfo.ProductVersion }
          "--- winget/msi logs"
          Get-ChildItem "$env:RUNNER_TEMP" -Filter *.log | ForEach-Object { "## $($_.Name)"; Get-Content $_.FullName -Tail 40 }
          Get-ChildItem "$env:LOCALAPPDATA\Packages\Microsoft.DesktopAppInstaller_8wekyb3d8bbwe\LocalState\DiagOutputDir" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime | Select-Object -Last 1 | ForEach-Object { "## $($_.Name)"; Get-Content $_.FullName -Tail 40 }
          if (-not $exe -or $listExit -ne 0) { Write-Error "Lagebuch not found after install"; exit 1 }
      - name: Uninstall
        run: |
          winget uninstall --id CodeForFire.Lagebuch -e --silent
          if ($LASTEXITCODE -ne 0) { exit 1 }
          winget list --id CodeForFire.Lagebuch -e
          if ($LASTEXITCODE -eq 0) { Write-Error "still listed"; exit 1 }
          "uninstalled"
