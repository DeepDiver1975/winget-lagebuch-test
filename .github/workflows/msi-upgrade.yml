name: MSI upgrade test
# Installs the released 0.8.0 (x86 MSI) through winget, then installs an MSI built from a
# lagebuch ref over it and checks that the major upgrade moved Lagebuch to the 64-bit location.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: CodeForFire/lagebuch ref to build
        default: fix/msi-x64
      version:
        description: Version to stamp on the test build (must be > 0.8.0)
        default: 0.8.1
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CodeForFire/lagebuch
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build MSI from ref (same commands as release.yml)
        run: |
          dotnet publish src/LageBuch.App/LageBuch.App.csproj -r win-x64 -c Release --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none -p:DebugSymbols=false -p:Version=$env:VERSION -o publish
          if ($LASTEXITCODE) { exit 1 }
          dotnet tool install --global wix --version 5.0.2
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $line = Select-String -Path .github/workflows/release.yml -Pattern 'wix build packaging' | Select-Object -First 1
          "release.yml: $($line.Line.Trim())"
          if ($line.Line -notmatch '-arch x64') { Write-Error "release.yml does not pass -arch x64"; exit 1 }
          wix build packaging/windows/Lagebuch.wxs -arch x64 -d Version=$env:VERSION `
            -d "PublishDir=$env:GITHUB_WORKSPACE\publish" `
            -d "IconFile=$env:GITHUB_WORKSPACE\src\LageBuch.App\Assets\icon.ico" `
            -o "$env:RUNNER_TEMP\new.msi"
          if ($LASTEXITCODE) { exit 1 }
      - name: Install released 0.8.0 via winget
        run: |
          winget install --id CodeForFire.Lagebuch -e --version 0.8.0 --silent --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Lagebuch\LageBuch.App.exe")) { Write-Error "0.8.0 not in Program Files (x86)"; exit 1 }
          "0.8.0 installed in Program Files (x86)"
      - name: Upgrade with the new MSI
        run: |
          $p = Start-Process msiexec -ArgumentList '/i', "`"$env:RUNNER_TEMP\new.msi`"", '/qn', '/norestart', '/l*v', "`"$env:RUNNER_TEMP\upgrade.log`"" -Wait -PassThru
          "msiexec exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\upgrade.log" -Tail 60; exit 1 }
          Select-String -Path "$env:RUNNER_TEMP\upgrade.log" -Pattern 'FindRelatedProducts|RemoveExistingProducts|Template|VersionNT64' | Select-Object -First 15 | ForEach-Object Line
      - name: Verify
        run: |
          function Entries {
            $keys = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                    'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
            @(Get-ItemProperty $keys -ErrorAction SilentlyContinue | Where-Object DisplayName -eq 'Lagebuch')
          }
          $fail = $false
          $e = Entries
          "--- uninstall entries"; $e | Format-List DisplayVersion, PSPath
          if ($e.Count -ne 1) { Write-Warning "expected exactly 1 entry, got $($e.Count)"; $fail = $true }
          if ($e.Count -ge 1 -and ($e[0].PSPath -match 'WOW6432Node')) { Write-Warning "still registered as 32-bit"; $fail = $true }
          if ($e.Count -ge 1 -and $e[0].DisplayVersion -ne $env:VERSION) { Write-Warning "wrong version"; $fail = $true }
          $exe = "$env:ProgramFiles\Lagebuch\LageBuch.App.exe"
          if (Test-Path $exe) { "$exe -> $((Get-Item $exe).VersionInfo.ProductVersion)" } else { Write-Warning "missing $exe"; $fail = $true }
          if (Test-Path "${env:ProgramFiles(x86)}\Lagebuch") { Write-Warning "Program Files (x86)\Lagebuch still exists"; Get-ChildItem "${env:ProgramFiles(x86)}\Lagebuch"; $fail = $true }
          $lnk = Get-ChildItem "$env:ProgramData\Microsoft\Windows\Start Menu\Programs" -Filter Lagebuch.lnk -Recurse -ErrorAction SilentlyContinue
          "start menu: $($lnk.FullName)"
          if ($lnk) { $t = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk[0].FullName).TargetPath; "shortcut -> $t"; if ($t -ne $exe) { Write-Warning "shortcut target wrong"; $fail = $true } }
          "--- winget list"; winget list --id CodeForFire.Lagebuch -e --accept-source-agreements
          if ($fail) { exit 1 }
          "upgrade OK"
      - name: Uninstall
        run: |
          winget uninstall --id CodeForFire.Lagebuch -e --silent
          if ($LASTEXITCODE) { exit 1 }
          if (Test-Path "$env:ProgramFiles\Lagebuch\LageBuch.App.exe") { Write-Error "still on disk"; exit 1 }
          "uninstalled"
